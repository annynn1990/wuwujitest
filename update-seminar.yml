name: 自動更新中天法門說明會

on:

  workflow_dispatch:

  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:

  update-seminar:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取官方說明會
        run: |
          python scripts/update_seminar.py

      - name: 檢查資料是否變更
        id: changed
        run: |

          if git diff --quiet -- seminar-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交更新
        if: steps.changed.outputs.changed == 'true'
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add seminar-data.json

          git commit \
            -m "自動更新中天法門說明會"

          git push

      - name: 沒有資料變更
        if: steps.changed.outputs.changed == 'false'
        run: |

          echo "說明會資料沒有變化。"
