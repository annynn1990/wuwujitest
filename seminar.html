<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>中天法門說明會｜最新場次與同步診斷</title>

<meta
name="description"
content="中天法門說明會最新場次，以及自動同步資料的診斷資訊。">

<link rel="canonical"
href="https://annynn1990.github.io/wuwujitest/seminar.html">

<style>

body {
    margin: 0;
    font-family:
        Arial,
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

    background: #07111f;
    color: #eef5ff;

    line-height: 1.8;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    color: #f3c969;
}

h2 {
    margin-top: 40px;
}

h3 {
    color: #f3c969;
}

.lead {
    color: #aebfd3;
    font-size: 1.1rem;
}

.notice {
    margin: 20px 0;
    padding: 20px;

    border-left: 5px solid #f3c969;

    background: rgba(243, 201, 105, 0.08);

    border-radius: 8px;
}

.success {
    border-left-color: #57d68d;
}

.error {
    border-left-color: #ff6868;
}

.warning {
    border-left-color: #ffb84d;
}

.event {
    margin: 15px 0;
    padding: 22px;

    background: #102238;

    border: 1px solid #27405c;

    border-radius: 15px;
}

.event h3 {
    margin-top: 0;
}

button,
.btn {
    display: inline-block;

    padding: 12px 20px;

    border: 0;

    border-radius: 30px;

    background: #f3c969;

    color: #111;

    font-weight: bold;

    cursor: pointer;

    text-decoration: none;

    margin: 5px;
}

.btn.secondary {
    background: transparent;
    color: white;
    border: 1px solid #45617e;
}

pre {

    background: #030914;

    border: 1px solid #27405c;

    padding: 20px;

    border-radius: 10px;

    white-space: pre-wrap;

    word-break: break-word;

    overflow-x: auto;

    color: #b9d7ef;

}

code {
    color: #f3c969;
}

.small {
    color: #8fa6bc;
    font-size: .9rem;
}

</style>

</head>


<body>


<div class="container">


<h1>
中天法門說明會
</h1>


<p class="lead">
自動同步場次與錯誤診斷
</p>


<a
class="btn"
href="https://web.wuwuji.tw/seminar"
target="_blank"
rel="noopener">

查看官方說明會

</a>


<button
onclick="checkData()">

重新檢查資料

</button>


<!-- ==================== -->
<!-- 狀態 -->
<!-- ==================== -->

<div
id="status"
class="notice">

正在檢查資料……

</div>


<!-- ==================== -->
<!-- 診斷 -->
<!-- ==================== -->

<h2>
同步診斷
</h2>


<div
id="diagnostic">

正在診斷……

</div>


<!-- ==================== -->
<!-- 場次 -->
<!-- ==================== -->

<h2>
目前可報名場次
</h2>


<div
id="events">

</div>


<!-- ==================== -->
<!-- 原始 JSON -->
<!-- ==================== -->

<h2>
seminar-data.json 原始內容
</h2>


<pre
id="raw">

尚未讀取

</pre>


<!-- ==================== -->
<!-- 更新時間 -->
<!-- ==================== -->

<h2>
資料狀態
</h2>


<div
id="updated"
class="notice">

最後同步時間：讀取中……

</div>


<p class="small">

資料來源：

<a
href="https://web.wuwuji.tw/seminar"
target="_blank">

https://web.wuwuji.tw/seminar

</a>

</p>


</div>


<script>


/*
==================================================
主要診斷程式
==================================================
*/


async function checkData() {


    const status =
        document.getElementById("status");


    const diagnostic =
        document.getElementById("diagnostic");


    const eventsBox =
        document.getElementById("events");


    const rawBox =
        document.getElementById("raw");


    const updated =
        document.getElementById("updated");


    /*
    ----------------------------------------------
    清空
    ----------------------------------------------
    */


    status.className = "notice";

    diagnostic.innerHTML = "";

    eventsBox.innerHTML = "";

    rawBox.textContent = "正在讀取……";


    updated.textContent =
        "最後同步時間：讀取中……";


    /*
    ----------------------------------------------
    找出 JSON 真實網址
    ----------------------------------------------
    */


    const dataURL =
        new URL(
            "seminar-data.json",
            window.location.href
        ).href;


    /*
    ----------------------------------------------
    顯示基本環境
    ----------------------------------------------
    */


    diagnostic.innerHTML += `

        <div class="notice">

            <strong>目前網頁：</strong><br>

            ${escapeHTML(
                window.location.href
            )}

            <br><br>

            <strong>準備讀取 JSON：</strong><br>

            ${escapeHTML(
                dataURL
            )}

        </div>

    `;


    /*
    ----------------------------------------------
    開始 Fetch
    ----------------------------------------------
    */


    let response;


    try {


        response =
            await fetch(

                dataURL,

                {

                    cache: "no-store"

                }

            );


    }

    catch (error) {


        status.className =
            "notice error";


        status.innerHTML = `

            <strong>
                ❌ Fetch 失敗
            </strong>

            <br><br>

            <strong>錯誤：</strong>

            ${escapeHTML(
                error.message
            )}

            <br><br>

            這通常代表：

            <ol>

                <li>
                    seminar-data.json 不存在
                </li>

                <li>
                    GitHub Pages 尚未部署最新版本
                </li>

                <li>
                    網址錯誤
                </li>

                <li>
                    瀏覽器無法取得該檔案
                </li>

            </ol>

        `;


        diagnostic.innerHTML += `

            <div class="notice error">

                <strong>
                    FETCH ERROR
                </strong>

                <pre>${escapeHTML(
                    error.toString()
                )}</pre>

            </div>

        `;


        rawBox.textContent =
            "無法取得 JSON";


        updated.textContent =
            "最後同步時間：讀取失敗";


        return;

    }


    /*
    ----------------------------------------------
    HTTP 狀態
    ----------------------------------------------
    */


    diagnostic.innerHTML += `

        <div class="notice">

            <strong>
                HTTP 狀態：
            </strong>

            ${response.status}

            <br>

            <strong>
                HTTP Status：
            </strong>

            ${escapeHTML(
                response.statusText
            )}

            <br>

            <strong>
                Content-Type：
            </strong>

            ${escapeHTML(
                response.headers.get(
                    "content-type"
                ) || "未知"
            )}

        </div>

    `;


    /*
    ----------------------------------------------
    HTTP 不是成功
    ----------------------------------------------
    */


    if (!response.ok) {


        status.className =
            "notice error";


        status.innerHTML = `

            <strong>
                ❌ JSON HTTP 讀取失敗
            </strong>

            <br><br>

            HTTP：

            ${response.status}

            ${escapeHTML(
                response.statusText
            )}

            <br><br>

            <strong>
                最可能原因：
            </strong>

            <ul>

                <li>
                    seminar-data.json 尚未部署
                </li>

                <li>
                    GitHub Pages 路徑錯誤
                </li>

                <li>
                    repository 中沒有此檔案
                </li>

            </ul>

        `;


        rawBox.textContent =
            "HTTP " +
            response.status;


        return;

    }


    /*
    ----------------------------------------------
    讀取原始文字
    ----------------------------------------------
    */


    let raw;


    try {

        raw =
            await response.text();

    }

    catch (error) {


        status.className =
            "notice error";


        status.innerHTML = `

            <strong>
                ❌ 無法讀取 JSON 內容
            </strong>

            <br><br>

            ${escapeHTML(
                error.message
            )}

        `;


        return;

    }


    /*
    ----------------------------------------------
    顯示原始 JSON
    ----------------------------------------------
    */


    rawBox.textContent =
        raw;


    /*
    ----------------------------------------------
    檢查空檔案
    ----------------------------------------------
    */


    if (!raw.trim()) {


        status.className =
            "notice error";


        status.innerHTML = `

            <strong>
                ❌ seminar-data.json 是空檔案
            </strong>

            <br><br>

            HTTP：

            ${response.status}

        `;


        return;

    }


    /*
    ----------------------------------------------
    JSON parse
    ----------------------------------------------
    */


    let data;


    try {

        data =
            JSON.parse(raw);

    }

    catch (error) {


        status.className =
            "notice error";


        status.innerHTML = `

            <strong>
                ❌ JSON 格式錯誤
            </strong>

            <br><br>

            <strong>
                JavaScript 錯誤：
            </strong>

            ${escapeHTML(
                error.message
            )}

            <br><br>

            請查看下面的
            「seminar-data.json 原始內容」。

        `;


        return;

    }


    /*
    ----------------------------------------------
    JSON 基本診斷
    ----------------------------------------------
    */


    diagnostic.innerHTML += `

        <div class="notice success">

            <strong>
                ✅ JSON 成功讀取
            </strong>

            <br>

            HTTP：
            ${response.status}

            <br>

            JSON 大小：
            ${raw.length}
            bytes

        </div>

    `;


    /*
    ----------------------------------------------
    source
    ----------------------------------------------
    */


    diagnostic.innerHTML += `

        <div class="notice">

            <strong>
                Source：
            </strong>

            ${escapeHTML(
                data.source || "沒有 source"
            )}

        </div>

    `;


    /*
    ----------------------------------------------
    updated_at
    ----------------------------------------------
    */


    if (data.updated_at) {

        const date =
            new Date(
                data.updated_at
            );


        updated.innerHTML = `

            <strong>
                ✅ 最後同步時間
            </strong>

            <br><br>

            ${date.toLocaleString(
                "zh-TW",
                {
                    timeZone:
                        "Asia/Taipei",

                    hour12:
                        false
                }
            )}

            <br><br>

            原始值：

            <code>

                ${escapeHTML(
                    data.updated_at
                )}

            </code>

        `;

    }

    else {

        updated.innerHTML = `

            <strong>
                ⚠️ 沒有同步時間
            </strong>

            <br><br>

            這通常表示：

            <br>

            Python 自動同步程式
            尚未成功更新
            seminar-data.json。

        `;

    }


    /*
    ----------------------------------------------
    events 檢查
    ----------------------------------------------
    */


    if (!Array.isArray(data.events)) {


        status.className =
            "notice error";


        status.innerHTML = `

            <strong>
                ❌ JSON 沒有 events 陣列
            </strong>

        `;


        return;

    }


    /*
    ----------------------------------------------
    0 場
    ----------------------------------------------
    */


    if (data.events.length === 0) {


        status.className =
            "notice warning";


        status.innerHTML = `

            <strong>
                ⚠️ JSON 讀取成功，但 events = 0
            </strong>

            <br><br>

            這代表：

            <br>

            <strong>
                網頁本身沒有讀取錯誤。
            </strong>

            <br><br>

            真正的問題在：

            <br><br>

            <strong>
                Python → 官方網站 → seminar-data.json
            </strong>

            <br><br>

            請查看 GitHub Actions
            「更新中天法門說明會」的執行結果。

        `;


        diagnostic.innerHTML += `

            <div class="notice warning">

                <strong>
                    場次診斷
                </strong>

                <br><br>

                events.length =

                <strong>
                    0
                </strong>

                <br><br>

                因此沒有任何場次可以顯示。

            </div>

        `;


        return;

    }


    /*
    ----------------------------------------------
    成功
    ----------------------------------------------
    */


    status.className =
        "notice success";


    status.innerHTML = `

        <strong>
            ✅ 成功取得說明會資料
        </strong>

        <br><br>

        場次：

        <strong>
            ${data.events.length}
        </strong>

        場

    `;


    /*
    ----------------------------------------------
    顯示場次
    ----------------------------------------------
    */


    data.events.forEach(
        (event, index) => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "event";


            div.innerHTML = `

                <h3>

                    ${index + 1}.

                    ${escapeHTML(
                        event.name ||
                        "中天法門說明會"
                    )}

                </h3>

                <p>

                    <strong>
                        日期：
                    </strong>

                    ${escapeHTML(
                        event.date_display ||
                        event.date ||
                        ""
                    )}

                </p>

                <p>

                    <strong>
                        報到：
                    </strong>

                    ${escapeHTML(
                        event.checkin ||
                        ""
                    )}

                    <br>

                    <strong>
                        說明會：
                    </strong>

                    ${escapeHTML(
                        event.start_time ||
                        ""
                    )}

                    <br>

                    <strong>
                        結束：
                    </strong>

                    ${escapeHTML(
                        event.end_time ||
                        ""
                    )}

                </p>

                <p>

                    <strong>
                        地點：
                    </strong>

                    ${escapeHTML(
                        event.address ||
                        ""
                    )}

                </p>


                <a
                    class="btn"
                    href="https://web.wuwuji.tw/seminar"
                    target="_blank"
                    rel="noopener">

                    前往官方報名

                </a>

            `;


            eventsBox.appendChild(
                div
            );

        }
    );

}


/*
==================================================
防止 HTML 注入
==================================================
*/


function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/*
==================================================
第一次自動檢查
==================================================
*/


checkData();

</script>


</body>

</html>
