<body>

<div class="container">

<!-- ==================== -->
<!-- 網站導覽 -->
<!-- ==================== -->

<nav>

    <a href="index.html">

    </a>

    <a href="seminar.html">
        說明會場次
    </a>

    <a
        href="https://web.wuwuji.tw/seminar"
        target="_blank"
        rel="noopener">
        官方說明會
    </a>

</nav>


<h1>
中天法門說明會
</h1>


<p class="lead">
自動同步場次與錯誤診斷
</p>


<a
class="btn"
href="https://web.wuwuji.tw/seminar"
target="_blank"
rel="noopener">

查看官方說明會

</a>


<button
onclick="checkData()">

重新檢查資料

</button>


<!-- ==================== -->
<!-- 狀態 -->
<!-- ==================== -->

<div
id="status"
class="notice">

正在檢查資料……

</div>


<!-- ==================== -->
<!-- 診斷 -->
<!-- ==================== -->

<h2>
同步診斷
</h2>


<div
id="diagnostic">

正在診斷……

</div>


<!-- ==================== -->
<!-- 場次 -->
<!-- ==================== -->

<h2>
目前可報名場次
</h2>


<div
id="events">

</div>


<!-- ==================== -->
<!-- 原始 JSON -->
<!-- ==================== -->

<h2>
seminar-data.json 原始內容
</h2>


<pre
id="raw">

尚未讀取

</pre>


<!-- ==================== -->
<!-- 更新時間 -->
<!-- ==================== -->

<h2>
資料狀態
</h2>


<div
id="updated"
class="notice">

最後同步時間：讀取中……

</div>


<p class="small">

資料來源：

<a
href="https://web.wuwuji.tw/seminar"
target="_blank"
rel="noopener">

https://web.wuwuji.tw/seminar

</a>

</p>


<div class="footer-links">

    <a href="index.html">
        返回首頁
    </a>

    <a href="seminar.html">
        說明會
    </a>

    <a
        href="https://web.wuwuji.tw/seminar"
        target="_blank"
        rel="noopener">
        官方網站
    </a>

</div>


</div>


<script>

async function checkData() {

    const status =
        document.getElementById("status");

    const diagnostic =
        document.getElementById("diagnostic");

    const eventsBox =
        document.getElementById("events");

    const rawBox =
        document.getElementById("raw");

    const updated =
        document.getElementById("updated");


    status.className = "notice";

    diagnostic.innerHTML = "";

    eventsBox.innerHTML = "";

    rawBox.textContent = "正在讀取……";

    updated.textContent =
        "最後同步時間：讀取中……";


    /*
    ----------------------------------------------
    JSON 路徑
    ----------------------------------------------
    */

    const dataURL =
        new URL(
            "seminar-data.json",
            window.location.href
        ).href;


    diagnostic.innerHTML += `

        <div class="notice">

            <strong>目前網頁：</strong><br>

            ${escapeHTML(
                window.location.href
            )}

            <br><br>

            <strong>準備讀取 JSON：</strong><br>

            ${escapeHTML(
                dataURL
            )}

        </div>

    `;


    /*
    ----------------------------------------------
    Fetch
    ----------------------------------------------
    */

    let response;

    try {

        response =
            await fetch(
                dataURL + "?t=" + Date.now(),
                {
                    cache: "no-store"
                }
            );

    }

    catch (error) {

        status.className =
            "notice error";

        status.innerHTML = `

            <strong>
                ❌ Fetch 失敗
            </strong>

            <br><br>

            ${escapeHTML(
                error.message
            )}

        `;

        rawBox.textContent =
            "無法取得 JSON";

        updated.textContent =
            "最後同步時間：讀取失敗";

        return;
    }


    /*
    ----------------------------------------------
    HTTP
    ----------------------------------------------
    */

    diagnostic.innerHTML += `

        <div class="notice">

            <strong>
                HTTP 狀態：
            </strong>

            ${response.status}

            <br>

            <strong>
                Content-Type：
            </strong>

            ${escapeHTML(
                response.headers.get(
                    "content-type"
                ) || "未知"
            )}

        </div>

    `;


    if (!response.ok) {

        status.className =
            "notice error";

        status.innerHTML = `

            <strong>
                ❌ JSON 讀取失敗
            </strong>

            <br><br>

            HTTP：
            ${response.status}

        `;

        rawBox.textContent =
            "HTTP " + response.status;

        return;
    }


    /*
    ----------------------------------------------
    讀取 JSON
    ----------------------------------------------
    */

    let raw;

    try {

        raw =
            await response.text();

    }

    catch (error) {

        status.className =
            "notice error";

        status.innerHTML = `

            <strong>
                ❌ 無法讀取 JSON
            </strong>

            <br><br>

            ${escapeHTML(
                error.message
            )}

        `;

        return;
    }


    rawBox.textContent = raw;


    if (!raw.trim()) {

        status.className =
            "notice error";

        status.innerHTML = `
            <strong>
                ❌ seminar-data.json 是空的
            </strong>
        `;

        return;
    }


    /*
    ----------------------------------------------
    JSON Parse
    ----------------------------------------------
    */

    let data;

    try {

        data =
            JSON.parse(raw);

    }

    catch (error) {

        status.className =
            "notice error";

        status.innerHTML = `

            <strong>
                ❌ JSON 格式錯誤
            </strong>

            <br><br>

            ${escapeHTML(
                error.message
            )}

        `;

        return;
    }


    /*
    ----------------------------------------------
    JSON 成功
    ----------------------------------------------
    */

    diagnostic.innerHTML += `

        <div class="notice success">

            <strong>
                ✅ JSON 成功讀取
            </strong>

            <br>

            HTTP：
            ${response.status}

            <br>

            JSON 大小：
            ${raw.length}
            bytes

            <br>

            events：

            <strong>
                ${
                    Array.isArray(data.events)
                        ? data.events.length
                        : 0
                }
            </strong>

            場

        </div>

    `;


    /*
    ----------------------------------------------
    更新時間
    ----------------------------------------------
    */

    if (data.updated_at) {

        const date =
            new Date(
                data.updated_at
            );

        updated.innerHTML = `

            <strong>
                ✅ 最後同步時間
            </strong>

            <br><br>

            ${date.toLocaleString(
                "zh-TW",
                {
                    timeZone:
                        "Asia/Taipei",

                    hour12:
                        false
                }
            )}

            <br><br>

            原始值：

            <code>
                ${escapeHTML(
                    data.updated_at
                )}
            </code>

        `;

    }

    else {

        updated.innerHTML = `
            <strong>
                ⚠️ 沒有同步時間
            </strong>
        `;
    }


    /*
    ----------------------------------------------
    events
    ----------------------------------------------
    */

    if (!Array.isArray(data.events)) {

        status.className =
            "notice error";

        status.innerHTML = `
            <strong>
                ❌ JSON 沒有 events 陣列
            </strong>
        `;

        return;
    }


    if (data.events.length === 0) {

        status.className =
            "notice warning";

        status.innerHTML = `

            <strong>
                ⚠️ 目前沒有場次
            </strong>

        `;

        return;
    }


    /*
    ----------------------------------------------
    成功
    ----------------------------------------------
    */

    status.className =
        "notice success";

    status.innerHTML = `

        <strong>
            ✅ 成功取得說明會資料
        </strong>

        <br><br>

        場次：

        <strong>
            ${data.events.length}
        </strong>

        場

    `;


    /*
    ----------------------------------------------
    顯示場次
    ----------------------------------------------
    */

    data.events.forEach(
        (event, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "event";


            div.innerHTML = `

                <h3>

                    ${index + 1}.
                    ${escapeHTML(
                        event.name ||
                        "中天法門說明會"
                    )}

                </h3>


                <p>

                    <strong>
                        日期：
                    </strong>

                    ${escapeHTML(
                        event.date_display ||
                        event.date ||
                        ""
                    )}

                </p>


                <p>

                    <strong>
                        報到：
                    </strong>

                    ${escapeHTML(
                        event.checkin ||
                        ""
                    )}

                    <br>

                    <strong>
                        說明會：
                    </strong>

                    ${escapeHTML(
                        event.start_time ||
                        ""
                    )}

                    <br>

                    <strong>
                        結束：
                    </strong>

                    ${escapeHTML(
                        event.end_time ||
                        ""
                    )}

                </p>


                <p>

                    <strong>
                        地點：
                    </strong>

                    ${escapeHTML(
                        event.address ||
                        ""
                    )}

                </p>


                <a
                    class="btn"
                    href="https://web.wuwuji.tw/seminar"
                    target="_blank"
                    rel="noopener">

                    前往官方報名

                </a>

            `;


            eventsBox.appendChild(
                div
            );

        }
    );

}


/*
==================================================
HTML Escape
==================================================
*/

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/*
==================================================
啟動
==================================================
*/

checkData();

</script>


</body>
