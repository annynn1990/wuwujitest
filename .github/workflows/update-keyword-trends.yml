name: 每週更新 SEO GEO 關鍵字趨勢

on:
  workflow_run:
    workflows: ["更新中天法門 AI GEO 知識庫"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: write

concurrency:
  group: seo-keyword-trends
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 Google Trends 套件
        run: pip install pytrends
      - name: 更新關鍵字趨勢
        run: python scripts/update_keyword_trends.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-dashboard/trend-data.json
          if git diff --cached --quiet; then
            echo "沒有趨勢資料變更。"
            exit 0
          fi
          git commit -m "更新每週 SEO GEO 關鍵字趨勢"
          git push
