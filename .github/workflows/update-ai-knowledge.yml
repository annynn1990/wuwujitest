name: 更新中天法門 AI GEO 知識庫

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "ai-knowledge/**"
  schedule:
    - cron: "0 3 */3 * *"

permissions:
  contents: write

concurrency:
  group: main-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 更新 AI/GEO 知識庫
        run: python scripts/update_ai_knowledge.py
      - name: 顯示同步摘要
        run: |
          python - <<'PY'
          import json
          with open("ai-knowledge/knowledge.json", encoding="utf-8") as f:
              d=json.load(f)
          print("generated_at:",d["generated_at"])
          print("official_pages:",d["stats"]["official_pages"])
          print("forum_index_pages:",d["stats"]["forum_index_pages"])
          print("forum_candidates:",d["stats"].get("forum_candidates",0))
          print("forum_pages_fetched:",d["stats"].get("forum_pages_fetched",0))
          print("forum_threads:",d["stats"]["forum_threads"])
          print("forum_posts:",d["stats"].get("forum_posts",0))
          print("forum_inaccessible:",d["stats"].get("forum_inaccessible",0))
          print("documents:",d["stats"]["documents"])
          print("claims:",d["stats"]["claims"])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-knowledge
          if git diff --cached --quiet; then
            echo "沒有資料變更，不建立 commit。"
            exit 0
          fi
          git commit -m "更新中天法門 AI GEO 知識庫"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "push 成功（第 ${attempt} 次）"
              exit 0
            fi
            echo "遠端 main 在 push 前再次變更，重試中（第 ${attempt} 次）"
            sleep 3
          done
          echo "5 次 push 重試後仍失敗。"
          exit 1
