name: 更新中天法門 AI GEO 知識庫
# 2026-09-22: 確保以 push 觸發首次實際同步

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "ai-knowledge/**"

  schedule:
    - cron: "0 3 */3 * *"

permissions:
  contents: write

concurrency:
  group: ai-knowledge-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 更新 AI/GEO 知識庫
        run: python scripts/update_ai_knowledge.py
      - name: 顯示同步摘要
        run: |
          python - <<'PY'
          import json
          with open("ai-knowledge/knowledge.json", encoding="utf-8") as f:
              d=json.load(f)
          print("generated_at:",d["generated_at"])
          print("official_pages:",d["stats"]["official_pages"])
          print("forum_index_pages:",d["stats"]["forum_index_pages"])
          print("forum_threads:",d["stats"]["forum_threads"])
          print("documents:",d["stats"]["documents"])
          print("claims:",d["stats"]["claims"])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-knowledge
          if git diff --cached --quiet; then
            echo "沒有資料變更，不建立 commit。"
            exit 0
          fi
          git commit -m "更新中天法門 AI GEO 知識庫"
          git push
