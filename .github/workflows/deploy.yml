name: 自動更新中天法門說明會

on:

  # 每 6 小時自動執行
  schedule:
    - cron: "15 */6 * * *"

  # GitHub Actions 頁面可以手動執行
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: 下載 Repository
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取官方說明會
        run: |
          python scripts/update_seminar.py

      - name: 檢查是否有變更
        id: changed
        run: |

          if git diff --quiet -- seminar-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交更新
        if: steps.changed.outputs.changed == 'true'
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add seminar-data.json

          git commit \
            -m "自動更新中天法門說明會"

          git push

      - name: 沒有新資料
        if: steps.changed.outputs.changed == 'false'
        run: |
          echo "說明會資料沒有變化，不需要提交。"
