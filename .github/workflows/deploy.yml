name: 中天法門說明會同步

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: 執行同步
        run: |

          python scripts/update_seminar.py


      - name: 顯示診斷
        if: always()
        run: |

          echo "============================"
          echo "seminar-debug.json"
          echo "============================"

          cat seminar-debug.json

          echo ""
          echo "============================"
          echo "seminar-data.json"
          echo "============================"

          cat seminar-data.json


      - name: 提交資料與診斷
        if: always()
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            seminar-data.json \
            seminar-debug.json


          git diff --cached --quiet || \

            git commit \
            -m "更新中天法門說明會同步資料"


          git push
