name: Build Full Semantic Map

on:
  push:
    paths:
      - 'ai-knowledge/knowledge.json'
      - 'ai-knowledge/topics.json'
      - 'ai-knowledge/sources.json'
      - 'scripts/build_semantic_map.py'
      - '.github/workflows/build-semantic-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build semantic map from all knowledge documents
        run: python3 scripts/build_semantic_map.py
      - name: Commit generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-knowledge/semantic-map.json
          if git diff --cached --quiet; then
            echo "No semantic map changes."
          else
            git commit -m "自動更新全量語義地圖"
            git push
          fi
