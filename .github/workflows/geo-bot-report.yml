name: GEO Robot Site Report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'about.html'
      - 'meditation.html'
      - 'course.html'
      - 'seminar.html'
      - 'faq.html'
      - 'media.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'ai-knowledge/**'
      - 'seo-dashboard/geo-blind-tests.json'
      - 'scripts/build_semantic_map.py'
      - 'scripts/build_geo_bot_report.py'
      - '.github/workflows/geo-bot-report.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: geo-bot-report
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate build scripts
        run: python3 -m py_compile scripts/build_semantic_map.py scripts/build_geo_bot_report.py

      - name: Build semantic map
        run: python3 scripts/build_semantic_map.py

      - name: Validate generated JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path("ai-knowledge/semantic-map.json"),
              Path("seo-dashboard/geo-bot-report.json"),
              Path("seo-dashboard/geo-effect-history.json"),
          ]:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"VALID JSON: {path}")
          PY

      - name: Build GEO robot report
        run: python3 scripts/build_geo_bot_report.py

      - name: Validate GEO report JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("seo-dashboard/geo-bot-report.json").read_text(encoding="utf-8"))
          print("VALID JSON: seo-dashboard/geo-bot-report.json")
          PY

      - name: Notify IndexNow
        shell: bash
        env:
          SITE_BASE: https://annynn1990.github.io/wuwujitest/
        run: |
          set -euo pipefail

          key_file=""
          while IFS= read -r f; do
            value="$(tr -d '\r\n' < "$f" || true)"
            if printf '%s' "$value" | grep -Eq '^[0-9a-fA-F]{32}$'; then
              key_file="$f"
              break
            fi
          done < <(find . -maxdepth 1 -type f -name '*.txt' -print)

          if [ -z "$key_file" ]; then
            echo "No 32-hex IndexNow key file found; skip."
            exit 0
          fi

          key="$(tr -d '\r\n' < "$key_file")"
          key_name="$(basename "$key_file")"
          key_location="$SITE_BASE$key_name"
          public_key="$(curl -fsSL "$key_location" | tr -d '\r\n')"
          test "$public_key" = "$key"

          : > /tmp/indexnow-urls.txt

          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              git diff-tree --no-commit-id --name-only -r "$after" > /tmp/changed.txt
            else
              git diff --name-only "$before" "$after" > /tmp/changed.txt
            fi

            while IFS= read -r path; do
              case "$path" in
                index.html) echo "$SITE_BASE" >> /tmp/indexnow-urls.txt ;;
                *.html|*.json|*.txt|*.xml)
                  case "$path" in
                    seo-dashboard/*)
                      [ "$path" = "seo-dashboard/geo-blind-tests.json" ] && echo "$SITE_BASE$path" >> /tmp/indexnow-urls.txt
                      ;;
                    ai-knowledge/*|about.html|meditation.html|course.html|seminar.html|faq.html|media.html|llms.txt|robots.txt|sitemap.xml|seminar-data.json)
                      echo "$SITE_BASE$path" >> /tmp/indexnow-urls.txt
                      ;;
                  esac
                  ;;
              esac
            done < /tmp/changed.txt
          else
            printf '%s\n' \
            "$SITE_BASE" \
            "$SITE_BASE/about.html" \
            "$SITE_BASE/meditation.html" \
            "$SITE_BASE/course.html" \
            "$SITE_BASE/seminar.html" \
            "$SITE_BASE/faq.html" \
            "$SITE_BASE/media.html" \
            "$SITE_BASE/ai-knowledge/index.html" \
            "$SITE_BASE/ai-knowledge/semantic-map.html" \
            "$SITE_BASE/sitemap.xml" \
            > /tmp/indexnow-urls.txt
          fi

          sort -u /tmp/indexnow-urls.txt -o /tmp/indexnow-urls.txt
          count="$(grep -c . /tmp/indexnow-urls.txt || true)"
          echo "IndexNow candidate URLs: $count"

          if [ "$count" -eq 0 ]; then
            echo "No public URL changed."
            exit 0
          fi

          KEY_FILE="$key_file" python3 - <<'PY'
          import json, os
          from pathlib import Path
          key_path=Path(os.environ["KEY_FILE"])
          key=key_path.read_text(encoding="utf-8").strip()
          urls=[x.strip() for x in Path("/tmp/indexnow-urls.txt").read_text().splitlines() if x.strip()]
          payload={
              "host":"annynn1990.github.io",
              "key":key,
              "keyLocation":"https://annynn1990.github.io/wuwujitest/"+key_path.name,
              "urlList":urls
          }
          Path("/tmp/indexnow-payload.json").write_text(json.dumps(payload,ensure_ascii=False),encoding="utf-8")
          PY

          code="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow-payload.json)"

          echo "IndexNow HTTP status: $code"
          cat /tmp/indexnow-response.txt || true
          case "$code" in
            200|202) echo "IndexNow notification accepted." ;;
            *) echo "IndexNow notification failed with HTTP $code."; exit 1 ;;
          esac

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-knowledge/semantic-map.json seo-dashboard/geo-bot-report.json seo-dashboard/geo-effect-history.json
          if git diff --cached --quiet; then
            echo "Generated files unchanged."
            exit 0
          fi
          git commit -m "自動更新 AI/GEO 語義圖與機器人報告 [skip ci]"
          git push
