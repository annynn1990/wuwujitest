name: GEO Robot Site Report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'about.html'
      - 'meditation.html'
      - 'course.html'
      - 'seminar.html'
      - 'faq.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'ai-knowledge/**'
      - 'seo-dashboard/**'
      - 'scripts/build_geo_bot_report.py'
      - '.github/workflows/geo-bot-report.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: geo-bot-report
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build robot report
        run: python3 scripts/build_geo_bot_report.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-dashboard/geo-bot-report.json seo-dashboard/geo-effect-history.json
          if git diff --cached --quiet; then
            echo "Report unchanged."
            exit 0
          fi
          git commit -m "自動更新 GEO 機器人全站報告"
          git push
