name: AI Citation Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run citation monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          CITATION_REPEATS: "3"
        run: python ai-citation/monitor.py

      - name: Commit citation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-citation/latest.json ai-citation/history/
          if git diff --cached --quiet; then
            echo "No citation data changes."
          else
            git commit -m "chore: update AI citation observations"
            git push
          fi
