name: 自動更新中天法門說明會

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 執行 Python
        run: |
          python scripts/update_seminar.py

      - name: 顯示結果
        if: always()
        run: |
          echo "===== seminar-debug.json ====="
          cat seminar-debug.json || true

          echo "===== seminar-data.json ====="
          cat seminar-data.json || true

      - name: 提交結果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seminar-data.json seminar-debug.json

          if ! git diff --cached --quiet; then
            git commit -m "更新中天法門說明會資料"
            git push
          fi
