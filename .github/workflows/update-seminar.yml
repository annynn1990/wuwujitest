name: 自動更新中天法門說明會

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 執行同步
        run: |
          python scripts/update_seminar.py

      - name: 檢查同步結果
        run: |
          echo "===== seminar-data.json ====="
          cat seminar-data.json

      - name: 提交更新資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seminar-data.json

          if git diff --cached --quiet; then
            echo "資料沒有變更"
          else
            git commit -m "自動更新說明會場次"
            git push origin HEAD:main
          fi
